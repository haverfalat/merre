name: Build draft releases

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: draft-release-queue
  cancel-in-progress: false

jobs:
  queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { queueDrafts } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/mobile-release.mjs`);
            await queueDrafts({ github, context, core });
